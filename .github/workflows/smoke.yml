name: Live MCP smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.MCP_RELEASED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run smoke
